
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: employee_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: employee_db
    volumes:
      - employee_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U employee_admin -d employee_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  flask:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:5002:5000"
    environment:
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  employee_pgdata:
    external: true